name: OpenTabletDriver Publish

on:
  workflow_call:
    inputs:
      version_suffix:
        description: 'Optional version suffix (e.g. for release candidates)'
        required: false
        type: string

jobs:
  matrixpublish:
    continue-on-error: true
    env:
      VERSION_SUFFIX: ${{ github.event.inputs.version_suffix }}
    strategy:
      matrix:
        build: [windows, macos, BinaryTarBall, RedHat, Debian, Simple]
        runtime-suffix: [x64]
        include:
          - build: BinaryTarBall
            os: ubuntu-latest
            runtime-prefix: linux-
          - build: RedHat
            os: ubuntu-latest
            runtime-prefix: linux-
            container: fedora
          - build: Debian
            os: ubuntu-latest
            runtime-prefix: linux-
          - build: Simple
            os: ubuntu-latest
            runtime-prefix: linux-
          - build: macos
            os: ubuntu-latest
            runtime-prefix: osx-
          - build: windows
            os: windows-latest
            runtime-prefix: win-
    # TODO: release or debug build
    name: ${{ matrix.build }} ${{ matrix.runtime-prefix }}${{ matrix.runtime-suffix }} Publish
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v6

      # Keep the existing build-wrapper call
      - uses: ./.github/actions/build-wrapper
        with:
          runtime: ${{ matrix.runtime-prefix }}${{ matrix.runtime-suffix }}
          package-name: ${{ matrix.build }}
          container: ${{ matrix.container }}

      # Add a lightweight self-contained publish step
      - name: Publish Self-Contained Daemon
        run: |
          dotnet publish OpenTabletDriver.Daemon \
            -c Release \
            -r ${{ matrix.runtime-prefix }}${{ matrix.runtime-suffix }} \
            --self-contained true \
            /p:PublishSingleFile=true

      - name: Publish Self-Contained UX
        run: |
          dotnet publish OpenTabletDriver.UX.${{ matrix.build }} \
            -c Release \
            -r ${{ matrix.runtime-prefix }}${{ matrix.runtime-suffix }} \
            --self-contained true \
            /p:PublishSingleFile=true

      - name: Upload Self-Contained Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.build }}-${{ matrix.runtime-prefix }}${{ matrix.runtime-suffix }}-selfcontained
          path: |
            **/bin/Release/${{ matrix.runtime-prefix }}${{ matrix.runtime-suffix }}/publish/*
